<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | OG Towing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Figtree", sans-serif;
            background: #f5f5f5;
        }

        .thank-you-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .thank-you-box {
            background: #fff;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        .thank-you-box h1 {
            color: #28a745;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .thank-you-box p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .thank-you-box a {
            display: inline-block;
            padding: 12px 30px;
            background: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .thank-you-box a:hover {
            background: #28a745;
        }

        .check-icon {
            font-size: 70px;
            color: #28a745;
            margin-bottom: 20px;
        }
    </style>

<body>

    <section class="thank-you-section">
        <div class="thank-you-box">
            <div class="check-icon">✔</div>

            <h1>Thank You!</h1>

            <p>
                Your request has been submitted successfully.
                Our OG Towing team will contact you shortly.
            </p>

            <a href="index.html">Back To Home</a>
        </div>
    </section>

</body>

</html>
